name: Build Insights image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - public/**
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - tsconfig.json
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: nurds-insights-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/nurds-inc/nurds-insights:${{ github.sha }}
            ghcr.io/nurds-inc/nurds-insights:latest
